<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ROLAN GMAIL Dashboard</title>

<style>
:root{
  --bg:#020508;
  --card:rgba(255,255,255,.03);
  --stroke:rgba(0,255,179,.12);
  --green:#00ffb3;
  --cyan:#00d4ff;
  --text:#eafff7;
  --muted:#7aa89a;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  background:
  radial-gradient(circle at top left, rgba(0,255,179,.15), transparent 35%),
  radial-gradient(circle at top right, rgba(0,212,255,.1), transparent 35%),
  var(--bg);

  color:white;
  min-height:100vh;
}

.header{
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:24px;
  font-weight:900;
  color:var(--green);
}

.menu-btn{
  font-size:24px;
  cursor:pointer;
}

.sidebar{
  position:fixed;
  top:0;
  left:-260px;
  width:250px;
  height:100%;
  background:#061015;
  border-right:1px solid rgba(0,255,179,.1);
  transition:.3s;
  z-index:999;
  padding:20px;
}

.sidebar.show{
  left:0;
}

.sidebar h2{
  color:var(--green);
  margin-bottom:20px;
}

.sidebar a{
  display:block;
  padding:14px;
  margin-bottom:10px;
  text-decoration:none;
  color:white;
  border-radius:12px;
  background:rgba(255,255,255,.03);
}

.container{
  max-width:800px;
  margin:auto;
  padding:15px;
}

.card{
  background:var(--card);
  border:1px solid var(--stroke);
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
  backdrop-filter:blur(20px);
}

.saldo{
  font-size:34px;
  color:var(--green);
  font-weight:900;
}

.label{
  color:var(--muted);
  margin-bottom:8px;
}

input,textarea{
  width:100%;
  padding:15px;
  margin-top:10px;
  border-radius:12px;
  border:1px solid rgba(0,255,179,.1);
  background:rgba(0,0,0,.4);
  color:white;
  outline:none;
}

textarea{
  resize:none;
  min-height:180px;
}

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:14px;
  cursor:pointer;
  font-weight:900;
  margin-top:12px;
  background:
  linear-gradient(
  90deg,
  var(--green),
  var(--cyan)
  );
}

.history{
  color:var(--muted);
  text-align:center;
  padding:20px;
}
</style>
</head>

<body>

<div class="sidebar" id="sidebar">

<h2>ROLAN GMAIL</h2>

<a href="dashboard.html">
🏠 Dashboard
</a>

<a href="withdraw.html">
💸 Withdraw
</a>

<a href="#" onclick="logout()">
🚪 Logout
</a>

</div>

<div class="header">
<div class="menu-btn" onclick="toggleMenu()">
☰
</div>

<div class="logo">
ROLAN GMAIL
</div>
</div>

<div class="container">

<div class="card">
<div class="label">
Saldo Anda
</div>

<div class="saldo" id="saldo">
Rp 0
</div>
</div>

<div class="card">
<div class="label">
Username
</div>

<h3 id="username">
-
</h3>
</div>

<div class="card">

<h3>Setor Gmail</h3>

<input
id="nama"
placeholder="Nama"
/>

<input
id="wa"
placeholder="Nomor WhatsApp"
/>

<textarea
id="gmail"
placeholder="1 Gmail per baris"
></textarea>

<button onclick="sendData()">
KIRIM STORAN
</button>

</div>

<div class="card">

<h3>Riwayat</h3>

<div class="history">
Segera hadir
</div>

</div>

</div>

<script>

const user =
JSON.parse(
localStorage.getItem('user')
);

if(!user){
 location='index.html';
}

document.getElementById(
'username'
).innerText=user.username;

async function loadUser(){

 try{

 const r=
 await fetch(
 `/api/session?username=${user.username}`
 );

 const d=
 await r.json();

 document.getElementById(
 'saldo'
 ).innerText=
 'Rp '+
 Number(
 d.saldo || 0
 ).toLocaleString('id-ID');

 }catch(e){
 console.log(e);
 }

}

loadUser();

function toggleMenu(){

 document
 .getElementById('sidebar')
 .classList
 .toggle('show');

}

function logout(){

 localStorage.removeItem('user');

 location='index.html';

}

async function sendData(){

 const nama=
 document.getElementById('nama').value;

 const wa=
 document.getElementById('wa').value;

 const gmail=
 document.getElementById('gmail').value;

 if(!nama || !wa || !gmail){

   return alert(
   'Lengkapi data'
   );

 }

 const list =
 gmail
 .split('\n')
 .filter(x=>x.trim());

 try{

 const r =
 await fetch(
 '/api/send',
 {
 method:'POST',
 headers:{
 'Content-Type':
 'application/json'
 },
 body:JSON.stringify({

 username:
 user.username,

 nama,
 wa,

 totalGmail:
 list.length,

 gmailList:
 gmail

 })
 });

 if(r.ok){

   alert(
   'Storan berhasil dikirim'
   );

   document
   .getElementById(
   'gmail'
   ).value='';

 }else{

   alert(
   'Gagal kirim'
   );

 }

 }catch(e){

   alert(
   'Network Error'
   );

 }

}

</script>

</body>
</html>
