<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setor Gmail</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  padding:20px;
  font-family:'Inter',sans-serif;
  background:#05070d;
  color:#eaf6ff;
}

/* TOMBOL KEMBALI */
.back-btn{
  position:fixed;
  top:15px;
  left:15px;
  padding:10px 14px;
  border-radius:12px;
  text-decoration:none;
  font-weight:800;
  font-size:13px;
  color:#eaf6ff;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(0,200,255,0.25);
  backdrop-filter:blur(12px);
  box-shadow:0 0 15px rgba(0,200,255,0.15);
  transition:.25s;
  z-index:999;
}

.container{
  max-width:520px;
  margin:60px auto 0;
}

.card{
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(0,200,255,0.2);
  border-radius:16px;
  padding:16px;
  margin-top:15px;
  backdrop-filter:blur(15px);
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
  color:#7fa7c7;
  margin-bottom:10px;
}

.title{
  font-size:18px;
  font-weight:900;
  margin-bottom:10px;
}

input,
textarea{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:12px;
  border:1px solid rgba(0,200,255,0.25);
  background:rgba(0,0,0,0.3);
  color:#fff;
  outline:none;
  font-family:'Inter',sans-serif;
  font-size:14px;
}

textarea{
  min-height:140px;
  resize:none;
}

.btn{
  width:100%;
  padding:14px;
  margin-top:14px;
  border:none;
  border-radius:14px;
  cursor:pointer;
  font-weight:900;
  font-size:14px;
  background:linear-gradient(90deg,#00d0ff,#0066ff);
  color:#001018;
}

.btn:disabled{
  opacity:.6;
}

.rules{
  font-size:13px;
  color:#7fa7c7;
  line-height:1.7;
}

.status{
  margin-top:12px;
  font-size:13px;
  text-align:center;
}

</style>
</head>

<body>

<a href="/dashboard.html" class="back-btn">
  ← Dashboard
</a>

<div class="container">

  <div class="card">
    <div class="header">
      <div><b>Rules Gmail</b></div>
      <div>24 Juni 2026</div>
    </div>

    <div class="rules">
      1. Gmail harus valid<br>
      2. Tidak boleh spam<br>
      3. Pastikan format benar<br>
      4. Jika salah akan ditolak
    </div>
  </div>

  <div class="card">

    <div class="title">Kolom Setor Gmail</div>

    <input id="nama" type="text" placeholder="Nama">

    <input id="wa" type="text" placeholder="Nomor WhatsApp">

    <textarea id="gmailList" placeholder="Gmail (1 per baris)

contoh:
gmail1@gmail.com
gmail2@gmail.com"></textarea>

    <button id="submitBtn" class="btn" onclick="kirimSetoran()">
      SETORKAN GMAIL
    </button>

    <div class="status" id="status"></div>

  </div>

</div>

<script>

async function kirimSetoran(){

  const nama = document.getElementById("nama").value.trim();
  const wa = document.getElementById("wa").value.trim();
  const gmailList = document.getElementById("gmailList").value.trim();

  const status = document.getElementById("status");
  const btn = document.getElementById("submitBtn");

  if(!nama || !wa || !gmailList){
    status.innerHTML = "❌ Lengkapi semua data";
    return;
  }

  const totalGmail = gmailList
    .split("\n")
    .filter(x => x.trim() !== "")
    .length;

  btn.disabled = true;
  status.innerHTML = "⏳ Mengirim setoran...";

  try{

    const res = await fetch("/api/send",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        username:nama,
        nama,
        wa,
        gmailList,
        totalGmail
      })
    });

    const data = await res.json();

    if(data.success){

      status.innerHTML = "✅ Setoran berhasil dikirim";

      document.getElementById("nama").value = "";
      document.getElementById("wa").value = "";
      document.getElementById("gmailList").value = "";

    }else{

      status.innerHTML = "❌ " + (data.error || "Gagal mengirim");

    }

  }catch(err){

    status.innerHTML = "❌ " + err.message;

  }

  btn.disabled = false;

}

</script>

</body>
</html>
