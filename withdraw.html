<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdraw</title>

<style>
body{
  background:#020508;
  color:#fff;
  font-family:Segoe UI;
  padding:20px;
}

.card{
  max-width:500px;
  margin:auto;
  background:#111;
  padding:20px;
  border-radius:15px;
  border:1px solid #00ffb3;
}

input{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:none;
  outline:none;
}

button{
  width:100%;
  padding:12px;
  margin-top:15px;
  background:#00ffb3;
  border:none;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="card">

<h2>Withdraw</h2>

<div id="saldo">Loading...</div>

<input id="nominal" placeholder="Nominal">
<input id="dana" placeholder="DANA / OVO / GOPAY">
<input id="nomor" placeholder="Nomor E-Wallet">
<input id="atasNama" placeholder="Atas Nama">

<button onclick="withdraw()">
AJUKAN WD
</button>

</div>

<script>

const user = JSON.parse(localStorage.getItem('user'));

if(!user){
 location.href = "index.html";
}

async function loadSaldo(){
 const r = await fetch(`/api/session?username=${user.username}`);
 const d = await r.json();

 document.getElementById("saldo").innerText =
 "Saldo: Rp " + Number(d.saldo || 0).toLocaleString("id-ID");
}

loadSaldo();

async function withdraw(){

 const nominal = document.getElementById('nominal').value;
 const dana = document.getElementById('dana').value;
 const nomor = document.getElementById('nomor').value;
 const atasNama = document.getElementById('atasNama').value;

 if(!nominal || !dana || !nomor || !atasNama){
  return alert("Lengkapi data");
 }

 const r = await fetch('/api/withdraw', {
  method:'POST',
  headers:{ 'Content-Type':'application/json' },
  body: JSON.stringify({
   username:user.username,
   nominal:Number(nominal),
   dana,
   nomor,
   atasNama
  })
 });

 const d = await r.json();

 if(r.ok){
  alert("WD berhasil diajukan");

  // refresh saldo biar keliatan langsung kepotong
  loadSaldo();

 } else {
  alert(d.error);
 }

}

</script>

</body>
</html>
