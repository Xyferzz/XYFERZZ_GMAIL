<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ADMIN PANEL</title>

<style>

body{
background:#050505;
color:#fff;
font-family:Segoe UI,sans-serif;
max-width:700px;
margin:auto;
padding:20px;
}

.card{
background:#101010;
border:1px solid #00ff99;
border-radius:20px;
padding:20px;
margin-top:20px;
box-shadow:0 0 20px rgba(0,255,153,.15);
}

h1{
color:#00ff99;
text-align:center;
}

input{
width:100%;
padding:15px;
margin-top:10px;
background:#181818;
border:1px solid #00ff99;
border-radius:12px;
color:white;
}

button{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:12px;
font-weight:700;
cursor:pointer;
background:#00ff99;
color:black;
}

#result{
margin-top:15px;
}
</style>
</head>

<body>

<h1>ADMIN PANEL</h1>

<div class="card">

<input
id="password"
type="password"
placeholder="Password Admin">

<input
id="requestId"
type="number"
placeholder="ID Request">

<input
id="approvedCount"
type="number"
placeholder="Jumlah Gmail ACC">

<button onclick="acc()">
ACC SEKARANG
</button>

<div id="result"></div>

</div>

<script>

async function acc(){

alert('TOMBOL KEKLIK');

try{

const password =
document.getElementById('password').value;

const requestId =
document.getElementById('requestId').value;

const approvedCount =
document.getElementById('approvedCount').value;

alert('Mengirim...');

const r = await fetch('/api/acc',{

method:'POST',

headers:{
'Content-Type':'application/json'
},

body:JSON.stringify({
password,
requestId,
approvedCount
})

});

const text = await r.text();

alert(text);

}catch(err){

alert('JS ERROR: ' + err.message);

console.log(err);

}

}

</script>

</body>
</html>
