<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ROLAN GMAIL LOGIN</title>

<style>
:root{
  --bg:#020508;
  --card:rgba(255,255,255,0.03);
  --stroke:rgba(0,255,179,0.12);
  --green:#00ffb3;
  --cyan:#00d4ff;
  --text:#eafff7;
  --muted:#7aa89a;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
  radial-gradient(circle at top left, rgba(0,255,179,.15), transparent 35%),
  radial-gradient(circle at top right, rgba(0,212,255,.1), transparent 35%),
  #020508;
  color:white;
  padding:20px;
}

.card{
  width:100%;
  max-width:420px;
  background:var(--card);
  border:1px solid var(--stroke);
  border-radius:24px;
  padding:30px;
  backdrop-filter:blur(25px);
  box-shadow:
  0 10px 40px rgba(0,0,0,.5),
  inset 0 0 10px rgba(255,255,255,.02);
}

.logo{
  text-align:center;
  font-size:34px;
  font-weight:900;
  margin-bottom:10px;
  background:linear-gradient(90deg,#fff,var(--green),var(--cyan));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.sub{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  margin-bottom:28px;
}

.switch{
  display:flex;
  margin-bottom:20px;
  gap:10px;
}

.switch button{
  flex:1;
  padding:13px;
  border:none;
  border-radius:14px;
  background:#071015;
  color:var(--muted);
  font-weight:700;
  cursor:pointer;
  transition:.3s;
}

.switch button.active{
  background:linear-gradient(90deg,var(--green),var(--cyan));
  color:#00150a;
}

.form{
  display:flex;
  flex-direction:column;
  gap:14px;
}

input{
  padding:15px;
  border-radius:14px;
  border:1px solid rgba(0,255,179,.12);
  background:rgba(0,0,0,.45);
  color:white;
  outline:none;
  font-size:14px;
}

input:focus{
  border-color:var(--green);
  box-shadow:0 0 15px rgba(0,255,179,.15);
}

.btn{
  padding:15px;
  border:none;
  border-radius:14px;
  background:linear-gradient(90deg,var(--green),var(--cyan));
  color:#00150a;
  font-weight:900;
  cursor:pointer;
  margin-top:5px;
  transition:.3s;
}

.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 20px rgba(0,255,179,.2);
}

.info{
  text-align:center;
  margin-top:16px;
  font-size:13px;
  color:var(--muted);
}

.loading{
  position:fixed;
  inset:0;
  background:#020508;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:999;
  flex-direction:column;
  gap:18px;
}

.loader{
  width:65px;
  height:65px;
  border-radius:50%;
  border:5px solid rgba(255,255,255,.08);
  border-top:5px solid var(--green);
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="loader"></div>
  <div style="color:var(--green);font-weight:700;">
    ROLAN GMAIL
  </div>
</div>

<div class="card">

  <div class="logo">ROLAN GMAIL</div>
  <div class="sub">Platform Gmail Boost 2026</div>

  <div class="switch">
    <button class="active" id="loginTab">LOGIN</button>
    <button id="registerTab">DAFTAR</button>
  </div>

  <div class="form">

    <input type="text" id="username" placeholder="Username">

    <input type="password" id="password" placeholder="Password">

    <button class="btn" id="submitBtn">
      LOGIN
    </button>

  </div>

  <div class="info" id="info">
    Login ke akun kamu
  </div>

</div>

<script>

setTimeout(()=>{
  document.getElementById('loading').style.display='none';
},1500);

if(localStorage.getItem('user')){
  window.location='dashboard.html';
}

let mode='login';

const loginTab=document.getElementById('loginTab');
const registerTab=document.getElementById('registerTab');
const submitBtn=document.getElementById('submitBtn');
const info=document.getElementById('info');

loginTab.onclick=()=>{
  mode='login';

  loginTab.classList.add('active');
  registerTab.classList.remove('active');

  submitBtn.innerText='LOGIN';
  info.innerText='Login ke akun kamu';
};

registerTab.onclick=()=>{
  mode='register';

  registerTab.classList.add('active');
  loginTab.classList.remove('active');

  submitBtn.innerText='DAFTAR';
  info.innerText='Buat akun baru';
};

submitBtn.onclick=async()=>{

  const username=document.getElementById('username').value;
  const password=document.getElementById('password').value;

  if(!username || !password){
    return alert('Lengkapi data!');
  }

  try{

    const url=
      mode==='login'
      ? '/api/login'
      : '/api/register';

    const r=await fetch(url,{
      method:'POST',
      headers:{
        'Content-Type':'application/json'
      },
      body:JSON.stringify({
        username,
        password
      })
    });

    const d=await r.json();

    if(!r.ok){
      return alert(d.error || 'Error');
    }

    if(mode==='register'){
      alert('Akun berhasil dibuat!');
      mode='login';

      loginTab.classList.add('active');
      registerTab.classList.remove('active');

      submitBtn.innerText='LOGIN';

      return;
    }

    localStorage.setItem(
      'user',
      JSON.stringify(d.user)
    );

    window.location='dashboard.html';

  }catch(e){

    alert('Network Error');

  }

};

</script>

</body>
</html>
