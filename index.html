<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROLAN GMAIL LOGIN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{
min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;
background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.25)),
url('https://images.unsplash.com/photo-1506744038136-46273834b3fb');
background-size:cover;background-position:center;
}
.card{
width:100%;max-width:400px;padding:35px;
background:rgba(255,255,255,.12);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.18);
border-radius:25px;color:white;overflow:hidden;
}
.logo{text-align:center;font-size:30px;font-weight:800;margin-bottom:10px}
.switch{display:flex;gap:10px;margin:20px 0}
.switch button{
flex:1;padding:12px;border:none;border-radius:10px;
background:rgba(255,255,255,.12);color:#fff;cursor:pointer;transition:.3s
}
.switch .active{background:#00a8ff}
.forms-wrap{position:relative;height:180px;overflow:hidden}
.forms-slider{display:flex;width:200%;transition:.5s ease}
.forms-slider.register{transform:translateX(-50%)}
.form{width:50%;padding-right:10px}
input{
width:100%;padding:12px 0;margin-bottom:14px;
background:transparent;border:none;
border-bottom:1px solid rgba(255,255,255,.5);
color:white;outline:none
}
.btn{
width:100%;padding:14px;border:none;border-radius:10px;
background:#00a8ff;color:#fff;font-weight:700;cursor:pointer
}
.info{text-align:center;margin-top:15px;color:#eee}
</style>
</head>
<body>
<div class="card">
<div class="logo">ROLAN GMAIL</div>

<div class="switch">
<button class="active" id="loginTab">LOGIN</button>
<button id="registerTab">DAFTAR</button>
</div>

<div class="forms-wrap">
<div class="forms-slider" id="slider">

<div class="form">
<input type="text" id="loginUsername" placeholder="Username">
<input type="password" id="loginPassword" placeholder="Password">
<button class="btn" id="loginBtn">SIGN IN</button>
</div>

<div class="form">
<input type="text" id="regUsername" placeholder="Username">
<input type="password" id="regPassword" placeholder="Password">
<button class="btn" id="registerBtn">CREATE ACCOUNT</button>
</div>

</div>
</div>

<div class="info" id="info">Login ke akun kamu</div>
</div>

<script>
const slider=document.getElementById('slider');
const loginTab=document.getElementById('loginTab');
const registerTab=document.getElementById('registerTab');
const info=document.getElementById('info');

loginTab.onclick=()=>{
slider.classList.remove('register');
loginTab.classList.add('active');
registerTab.classList.remove('active');
info.textContent='Login ke akun kamu';
};

registerTab.onclick=()=>{
slider.classList.add('register');
registerTab.classList.add('active');
loginTab.classList.remove('active');
info.textContent='Buat akun baru';
};

document.getElementById('loginBtn').onclick=async()=>{
const username=document.getElementById('loginUsername').value;
const password=document.getElementById('loginPassword').value;

const r=await fetch('/api/login',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({username,password})
});

const d=await r.json();
if(!r.ok) return alert(d.error||'Error');

localStorage.setItem('user',JSON.stringify(d.user));
window.location='dashboard.html';
};

document.getElementById('registerBtn').onclick=async()=>{
const username=document.getElementById('regUsername').value;
const password=document.getElementById('regPassword').value;

const r=await fetch('/api/register',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({username,password})
});

const d=await r.json();
if(!r.ok) return alert(d.error||'Error');

alert('Akun berhasil dibuat!');
loginTab.click();
};
</script>
</body>
</html>
