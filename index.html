<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ROLAN GMAIL LOGIN</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;

  background:
  linear-gradient(
    rgba(0,0,0,.25),
    rgba(0,0,0,.25)
  ),
  url('https://images.unsplash.com/photo-1506744038136-46273834b3fb');

  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}

.card{
  width:100%;
  max-width:380px;

  padding:35px;

  background:rgba(255,255,255,0.12);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  border:1px solid rgba(255,255,255,.18);

  border-radius:25px;

  box-shadow:
  0 8px 32px rgba(0,0,0,.35);
}

.logo{
  text-align:center;
  color:white;
  font-size:30px;
  font-weight:800;
  margin-bottom:8px;
  letter-spacing:2px;
}

.sub{
  text-align:center;
  color:rgba(255,255,255,.8);
  margin-bottom:25px;
  font-size:13px;
}

.switch{
  display:flex;
  gap:10px;
  margin-bottom:25px;
}

.switch button{
  flex:1;
  padding:12px;

  border:none;
  border-radius:10px;

  background:rgba(255,255,255,.12);

  color:white;
  cursor:pointer;
  transition:.3s;
}

.switch button.active{
  background:#00a8ff;
}

.form{
  display:flex;
  flex-direction:column;
  gap:14px;
  transition:all .35s ease;
}

.form.hide{
  opacity:0;
  transform:translateX(30px);
}

input{
  width:100%;
  padding:12px 0;

  background:transparent;
  border:none;
  border-bottom:1px solid rgba(255,255,255,.45);

  color:white;
  font-size:14px;
  outline:none;
}

input::placeholder{
  color:rgba(255,255,255,.7);
}

.btn{
  margin-top:10px;

  border:none;
  border-radius:10px;

  padding:14px;

  background:#00a8ff;
  color:white;

  font-weight:700;
  cursor:pointer;

  transition:.3s;
}

.btn:hover{
  transform:translateY(-2px);
}

.info{
  text-align:center;
  margin-top:20px;
  color:rgba(255,255,255,.85);
  font-size:13px;
}

.loading{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  gap:15px;
  z-index:999;
}

.loader{
  width:60px;
  height:60px;
  border-radius:50%;

  border:4px solid rgba(255,255,255,.2);
  border-top:4px solid #00a8ff;

  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

  .card{
  animation:showCard .8s ease;
}

@keyframes showCard{
  from{
    opacity:0;
    transform:translateY(30px) scale(.95);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="loader"></div>
  <div style="color:white;font-weight:700;">
    ROLAN GMAIL
  </div>
</div>

<div class="card">

  <div class="logo">LOGIN</div>

  <div class="sub">
    Rolan Gmail Platform
  </div>

  <div class="switch">
    <button class="active" id="loginTab">LOGIN</button>
    <button id="registerTab">DAFTAR</button>
  </div>

  <div class="form">

    <input
      type="text"
      id="username"
      placeholder="Username">

    <input
      type="password"
      id="password"
      placeholder="Password">

    <button
      class="btn"
      id="submitBtn">
      SIGN IN
    </button>

  </div>

  <div class="info" id="info">
    Login ke akun kamu
  </div>

</div>

<script>

setTimeout(()=>{
  document.getElementById('loading').style.display='none';
},1500);

if(localStorage.getItem('user')){
  window.location='dashboard.html';
}

let mode='login';

const loginTab=document.getElementById('loginTab');
const registerTab=document.getElementById('registerTab');
const submitBtn=document.getElementById('submitBtn');
const info=document.getElementById('info');

const form=document.querySelector('.form');

function switchMode(newMode){

  form.classList.add('hide');

  setTimeout(()=>{

    mode=newMode;

    if(mode==='login'){

      loginTab.classList.add('active');
      registerTab.classList.remove('active');

      submitBtn.innerText='SIGN IN';
      info.innerText='Login ke akun kamu';

    }else{

      registerTab.classList.add('active');
      loginTab.classList.remove('active');

      submitBtn.innerText='CREATE ACCOUNT';
      info.innerText='Buat akun baru';

    }

    form.classList.remove('hide');

  },250);

}

loginTab.onclick=()=>{
  switchMode('login');
};

registerTab.onclick=()=>{
  switchMode('register');
};

submitBtn.onclick=async()=>{

  const username=
  document.getElementById('username').value;

  const password=
  document.getElementById('password').value;

  if(!username || !password){
    return alert('Lengkapi data!');
  }

  try{

    const url=
    mode==='login'
    ? '/api/login'
    : '/api/register';

    const r=await fetch(url,{
      method:'POST',
      headers:{
        'Content-Type':'application/json'
      },
      body:JSON.stringify({
        username,
        password
      })
    });

    const d=await r.json();

    if(!r.ok){
      return alert(d.error || 'Error');
    }

    if(mode==='register'){
      alert('Akun berhasil dibuat!');

      mode='login';

      loginTab.classList.add('active');
      registerTab.classList.remove('active');

      submitBtn.innerText='SIGN IN';

      return;
    }

    localStorage.setItem(
      'user',
      JSON.stringify(d.user)
    );

    window.location='dashboard.html';

  }catch{

    alert('Network Error');

  }

};

</script>

</body>
</html>
